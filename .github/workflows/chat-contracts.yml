name: Chat contracts
on:
  pull_request:
  push:
    branches: [test/natural-outing-conversations]
permissions:
  contents: read
concurrency:
  group: chat-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-acceptance-results
          path: docs/unified-pipeline/acceptance-results.json
          if-no-files-found: ignore
